name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare custom instructions
        run: |
          # Combine CLAUDE.md and AGENTS.md into a single instruction file
          rm -f /tmp/combined_instructions.txt
          touch /tmp/combined_instructions.txt
          
          # Add CLAUDE.md if it exists
          if [ -f "CLAUDE.md" ]; then
            cat CLAUDE.md >> /tmp/combined_instructions.txt
            echo "" >> /tmp/combined_instructions.txt
            echo "" >> /tmp/combined_instructions.txt
          fi
          
          # Add AGENTS.md if it exists
          if [ -f "AGENTS.md" ]; then
            cat AGENTS.md >> /tmp/combined_instructions.txt
          fi
          
          # Create a settings JSON file with the system prompt
          # Use jq --rawfile to safely read the file and properly encode it as JSON
          if [ -s /tmp/combined_instructions.txt ]; then
            jq -n --rawfile prompt /tmp/combined_instructions.txt '{systemPrompt: $prompt}' > /tmp/claude_settings.json
            echo "Created settings file with custom instructions from CLAUDE.md and AGENTS.md"
          else
            echo "{}" > /tmp/claude_settings.json
            echo "No custom instructions found"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

          # Automatically include custom instructions from CLAUDE.md and AGENTS.md
          settings: /tmp/claude_settings.json

