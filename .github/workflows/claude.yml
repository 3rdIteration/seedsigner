name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare custom instructions
        run: |
          # Combine CLAUDE.md and AGENTS.md into a single instruction file
          rm -f /tmp/combined_instructions.txt
          touch /tmp/combined_instructions.txt
          
          # Add CLAUDE.md if it exists
          if [ -f "CLAUDE.md" ]; then
            cat CLAUDE.md >> /tmp/combined_instructions.txt
            echo "" >> /tmp/combined_instructions.txt
            echo "" >> /tmp/combined_instructions.txt
          fi
          
          # Add AGENTS.md if it exists
          if [ -f "AGENTS.md" ]; then
            cat AGENTS.md >> /tmp/combined_instructions.txt
          fi
          
          # Create a settings JSON file with the system prompt
          # Use jq --rawfile to safely read the file and properly encode it as JSON
          if [ -s /tmp/combined_instructions.txt ]; then
            jq -n --rawfile prompt /tmp/combined_instructions.txt '{systemPrompt: $prompt}' > /tmp/claude_settings.json
            echo "Created settings file with custom instructions from CLAUDE.md and AGENTS.md"
          else
            echo "{}" > /tmp/claude_settings.json
            echo "No custom instructions found"
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Automatically include custom instructions from CLAUDE.md and AGENTS.md
          settings: /tmp/claude_settings.json

