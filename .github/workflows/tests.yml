name: CI

on:
  push:
  pull_request:

# Explicitly restrict the auto-provisioned GITHUB_TOKEN to the least privilege required
# for this workflow.
permissions:
  contents: read

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Used by the `Version` class so it can identify the current fork
  PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}

  # Used by `Version`. We want the PR author's latest commit hash if this is a PR
  # but the default SHA env var reflects a new commit into the target repo.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10: currently used by Seedsigner
        # 3.12: latest stable Python as upper test bound
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          # Needs to also pull the seedsigner-translations repo
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      # The jcardsim tests run the real JavaCard applets. Without a JDK and the applet
      # sources they skip with a reason rather than failing, so this is additive.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Check out JavaCard applet sources
        run: |
          mkdir -p "$HOME/applet-repos"
          # Satochip-DIY is the aggregator: it carries the Satochip/SeedKeeper/Satodime
          # sources *and* the JavaCard SDKs as submodules, so it needs --recursive.
          git clone --recursive --depth 1 \
            https://github.com/3rdIteration/Satochip-DIY.git \
            "$HOME/applet-repos/Satochip-DIY"
          # SeedKeeper is built at two tags (v0.1 and v0.2), so this one needs full
          # history -- git archive cannot export a tag that was not fetched.
          git clone --recursive \
            https://github.com/Toporin/Seedkeeper-Applet.git \
            "$HOME/applet-repos/Seedkeeper-Applet"
          # Provides the jcardsim jar the simulator runs on, as well as the Keycard
          # applet sources.
          git clone --recursive --depth 1 \
            https://github.com/status-im/status-keycard.git \
            "$HOME/applet-repos/status-keycard"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2 pinentry-curses pinentry-tty libzbar0 libpcsclite-dev pcscd swig
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements.txt
          # requirements-l10n.txt is hash-locked (SeedSigner OS installs it
          # during image builds). It needs its own pip invocation: one hashed
          # requirement makes pip demand hashes for everything else in the
          # same invocation, which the unhashed files above and `-e .` below
          # can't satisfy.
          pip install -r l10n/requirements-l10n.txt
          pip install -e .
      - name: Compile translations
        run: python setup.py compile_catalog
      - name: Test with pytest
        run: |
          mkdir -p artifacts
          # Where the applet checkouts above landed. The jcardsim harness looks here for
          # them and skips with a reason if any are missing, so this never breaks the run.
          export SEEDSIGNER_APPLET_ROOT="$HOME/applet-repos"
          python -m pytest \
            --color=yes \
            --cov=seedsigner \
            --cov-branch \
            --durations 5 \
            -vv
      - name: Generate screenshots
        run: |
          python -m pytest tests/screenshot_generator/generator.py \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            --cov-report html:./artifacts/cov_html \
            -vv
          cp -r ./seedsigner-screenshots ./artifacts/
      - name: Coverage report
        run: coverage report
      - name: Archive CI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: artifacts/**
          retention-days: 10
        # Upload also when tests fail. The workflow result (red/green) will
        # not be affected by this.
        if: always()

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # Windows + Python 3.14: no pre-built cp314 wheels for embit,
          # cffi, pyscard; building from source causes segfaults.
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2 pinentry-curses pinentry-tty libzbar0 libpcsclite-dev pcscd swig
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt -r tests/requirements.txt
          # requirements-l10n.txt is hash-locked and needs its own pip invocation:
          # one hashed requirement makes pip demand hashes for everything else in
          # the same invocation, which the unhashed files above and `-e .` below
          # can't satisfy.
          pip install -r l10n/requirements-l10n.txt
          pip install -e .
      - name: Compile translations
        run: python setup.py compile_catalog
      - name: Test with pytest
        run: |
          python -m pytest \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            --durations 5 \
            -vv
