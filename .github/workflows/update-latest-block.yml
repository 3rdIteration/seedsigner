name: Update latest-block anchor

# Refreshes src/seedsigner/resources/latest-block.json, which lets the device
# turn a block-height nLockTime into an approximate calendar date. The device
# has no RTC and no chain tip, so without an anchor a height is an
# uninterpretable number and a long timelock is invisible on the review screens.
#
# The value is advisory: it only shifts a *displayed* estimate and never feeds a
# signing decision, so a stale anchor is harmless and a wrong one cannot
# authorise anything. That is why fetching it from a third-party explorer in CI
# is acceptable here -- and why this opens a PR rather than pushing to a branch
# directly, so the change is still reviewed like any other.

on:
  schedule:
    # Monthly is far more often than needed; month-level accuracy tolerates a
    # badly stale anchor.
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current tip
        id: tip
        run: |
          set -euo pipefail

          height=$(curl -fsS --retry 3 --max-time 30 https://mempool.space/api/blocks/tip/height)
          hash=$(curl -fsS --retry 3 --max-time 30 https://mempool.space/api/block-height/"$height")
          timestamp=$(curl -fsS --retry 3 --max-time 30 https://mempool.space/api/block/"$hash" | jq -r '.timestamp')

          # Refuse anything implausible rather than committing garbage. The
          # device tolerates a bad anchor, but there is no reason to ship one.
          case "$height" in ''|*[!0-9]*) echo "bad height: $height" >&2; exit 1;; esac
          case "$timestamp" in ''|*[!0-9]*) echo "bad timestamp: $timestamp" >&2; exit 1;; esac
          if [ "$height" -lt 900000 ]; then echo "height went backwards: $height" >&2; exit 1; fi

          echo "height=$height"       >> "$GITHUB_OUTPUT"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "updated=$(date -u -d "@$timestamp" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Write latest-block.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os

          path = "src/seedsigner/resources/latest-block.json"
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)

          data["height"] = int(os.environ["HEIGHT"])
          data["timestamp"] = int(os.environ["TIMESTAMP"])
          data["updated"] = os.environ["UPDATED"]

          with open(path, "w", encoding="utf-8", newline="\n") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\n")
          PY
        env:
          HEIGHT: ${{ steps.tip.outputs.height }}
          TIMESTAMP: ${{ steps.tip.outputs.timestamp }}
          UPDATED: ${{ steps.tip.outputs.updated }}

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-latest-block
          title: "chore: refresh latest-block anchor to ${{ steps.tip.outputs.height }}"
          commit-message: |
            chore: refresh latest-block anchor to ${{ steps.tip.outputs.height }}

            Block ${{ steps.tip.outputs.height }} (${{ steps.tip.outputs.updated }}),
            used to estimate a calendar date for block-height nLockTime values.
          body: |
            Automated refresh of `src/seedsigner/resources/latest-block.json`.

            - height: `${{ steps.tip.outputs.height }}`
            - timestamp: `${{ steps.tip.outputs.timestamp }}` (${{ steps.tip.outputs.updated }})

            The anchor lets the approval screen render a block-height nLockTime as
            an approximate date. It only affects a displayed estimate and never a
            signing decision, so this is safe to merge or ignore.
          delete-branch: true
